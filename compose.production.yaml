name: ai-chat-production

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-environment: &app-environment
  DATABASE_URL: postgres://ai_chat:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/ai_chat
  REDIS_URL: redis://redis:6379
  R2_ENDPOINT: ${R2_ENDPOINT:?set R2_ENDPOINT}
  R2_BUCKET: ${R2_BUCKET:?set R2_BUCKET}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY}
  FORTUNE_MCP_URL: ${FORTUNE_MCP_URL:-}
  FORTUNE_MCP_API_KEY: ${FORTUNE_MCP_API_KEY:-}
  BAIDU_MAPS_API_KEY: ${BAIDU_MAPS_API_KEY:-}

services:
  postgres:
    <<: *service
    image: ${POSTGRES_IMAGE:-ai-chat-postgres:18.4-rag}
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch"]
    environment:
      POSTGRES_DB: ai_chat
      POSTGRES_USER: ai_chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_chat -d ai_chat"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *service
    image: ${REDIS_IMAGE:-redis:8-alpine}
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${WORKER_IMAGE:-ai-chat-worker:local}
    init: true
    restart: "no"
    command: ["node", "--import", "tsx", "packages/db/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://ai_chat:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/ai_chat
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *service
    image: ${WEB_IMAGE:-ai-chat-web:local}
    init: true
    environment:
      <<: *app-environment
      BETTER_AUTH_URL: ${APP_ORIGIN:-http://localhost:3001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  worker:
    <<: *service
    image: ${WORKER_IMAGE:-ai-chat-worker:local}
    init: true
    stop_grace_period: 60s
    environment:
      <<: *app-environment
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.a6api.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-sol}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-https://api.a6api.com/v1}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2}
      IMAGE_API_KEY: ${IMAGE_API_KEY:?set IMAGE_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?set DASHSCOPE_API_KEY}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:?set EMBEDDING_BASE_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3.7-text-embedding}
      EMBEDDING_DIMENSIONS: "1024"
      RERANK_BASE_URL: ${RERANK_BASE_URL:?set RERANK_BASE_URL}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3.7-text-rerank}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  caddy:
    <<: *service
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    # 仅服务器回环地址可访问；公网访问走 SSH 隧道，不开放网站端口。
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
