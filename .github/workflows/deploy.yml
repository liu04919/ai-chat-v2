name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

# 发布不能被新一次发布中途取消，避免停服务或迁移只完成一半。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Package the exact tested revision
        run: |
          set -euo pipefail
          mkdir bundle
          # 只取 Git 中这次通过 CI 的源码，不带依赖、构建产物或线上密钥。
          git archive "$GITHUB_SHA" Dockerfile .dockerignore package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json apps packages compose.production.yaml deploy/Caddyfile deploy/activate.sh | tar -x -C bundle
          cd bundle
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS .
          tar -czf ../release.tar.gz .
          cd ..
          sha256sum release.tar.gz > release.tar.gz.sha256
          printf 'Source archive: %s bytes\n' "$(stat -c %s release.tar.gz)"
      - name: Upload and activate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          key="$RUNNER_TEMP/deploy-key"
          hosts="$RUNNER_TEMP/deploy-known-hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          ssh_options=(-i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          release="/home/ubuntu/ai-chat/releases/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_options[@]}" "$target" "umask 077; mkdir -p '$release'"
          scp "${ssh_options[@]}" release.tar.gz release.tar.gz.sha256 "$target:$release/"
          ssh "${ssh_options[@]}" "$target" "cd '$release' && sha256sum --check --strict release.tar.gz.sha256 && tar -xzf release.tar.gz && bash deploy/activate.sh '$GITHUB_SHA'"
          printf 'Published commit `%s` through SSH.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
