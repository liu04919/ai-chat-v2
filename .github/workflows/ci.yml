name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: ai-chat-ci
      TEST_DATABASE_URL: postgres://ai_chat:ai_chat_local@localhost:5433/ai_chat_test
      DATABASE_URL: postgres://ai_chat:ai_chat_local@localhost:5433/ai_chat_test
      REDIS_URL: redis://localhost:6380
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-test-secret-not-used-in-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - name: Check deployment scripts and configuration
        run: |
          bash -n deploy/activate.sh
          shellcheck deploy/activate.sh deploy/activate.test.sh
          bash deploy/activate.test.sh
          docker compose --env-file deploy/.env.example -f compose.production.yaml config --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the test PostgreSQL image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docker/postgres
          load: true
          tags: ai-chat-postgres:18.4-rag
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - run: docker compose up -d --no-build --wait postgres redis
      # 假模型/假存储配合真实 PG、Redis，不调用付费模型或线上资源。
      - run: pnpm test:integration
      - name: Clean up isolated CI infrastructure
        if: always()
        run: docker compose -p ai-chat-ci down --volumes

  images:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ai-chat-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
